services:
  bot:
    build:
      context: ./bot
    container_name: ai-agent-bot
    env_file:
      - ./bot/.env
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ai-agent-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped